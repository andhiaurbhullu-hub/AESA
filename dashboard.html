<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AESA Admin Dashboard</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            color: #222;
        }

        header {
            background: #111827;
            color: white;
            padding: 18px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        header h1 {
            margin: 0;
            font-size: 22px;
        }

        #logoutBtn {
            background: #dc2626;
            color: white;
            border: none;
            padding: 9px 16px;
            border-radius: 7px;
            cursor: pointer;
        }

        .container {
            max-width: 1100px;
            margin: 30px auto;
            padding: 0 20px;
        }

        .welcome {
            margin-bottom: 25px;
        }

        .card {
            background: white;
            padding: 25px;
            border-radius: 12px;
            margin-bottom: 25px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.06);
        }

        .card h2 {
            margin-top: 0;
        }

        label {
            display: block;
            margin-top: 15px;
            margin-bottom: 6px;
            font-weight: bold;
        }

        input,
        textarea {
            width: 100%;
            padding: 11px;
            border: 1px solid #ccc;
            border-radius: 7px;
            font-size: 15px;
        }

        textarea {
            min-height: 100px;
            resize: vertical;
        }

        .add-btn {
            margin-top: 20px;
            background: #2563eb;
            color: white;
            border: none;
            padding: 12px 22px;
            border-radius: 7px;
            cursor: pointer;
            font-size: 15px;
        }

        .add-btn:hover {
            background: #1d4ed8;
        }

        #message {
            margin-top: 15px;
            font-weight: bold;
        }

        .event {
            border: 1px solid #ddd;
            border-radius: 10px;
            padding: 18px;
            margin-top: 15px;
        }

        .event h3 {
            margin-top: 0;
        }

        .delete-btn {
            background: #dc2626;
            color: white;
            border: none;
            padding: 8px 14px;
            border-radius: 6px;
            cursor: pointer;
            margin-top: 10px;
        }

        .event-info {
            color: #555;
            margin: 5px 0;
        }
    </style>
</head>

<body>

<header>

    <h1>AESA Admin Dashboard</h1>

    <button id="logoutBtn">
        Logout
    </button>

</header>


<div class="container">

    <div class="welcome">

        <h2>Welcome, Admin 👋</h2>

        <p>
            Manage the AESA website from here.
        </p>

    </div>


    <!-- ADD EVENT -->

    <div class="card">

        <h2>📅 Add New Event</h2>

        <form id="eventForm">

            <label>Event Title</label>

            <input
                type="text"
                id="title"
                placeholder="Example: Technical Symposium"
                required
            >


            <label>Description</label>

            <textarea
                id="description"
                placeholder="Describe the event..."
            ></textarea>


            <label>Event Date</label>

            <input
                type="date"
                id="event_date"
                required
            >


            <label>Event Time</label>

            <input
                type="text"
                id="event_time"
                placeholder="Example: 10:00 AM"
            >


            <label>Location</label>

            <input
                type="text"
                id="location"
                placeholder="Example: Seminar Hall"
            >


            <button
                type="submit"
                class="add-btn"
            >
                Add Event
            </button>

        </form>

        <p id="message"></p>

    </div>


    <!-- EVENTS -->

    <div class="card">

        <h2>📋 Existing Events</h2>

        <div id="eventsContainer">
            Loading events...
        </div>

    </div>

</div>


<script>

    /* =========================
       SUPABASE CONNECTION
       ========================= */

    const SUPABASE_URL =
        "https://xngmfbsbpumekitugtbg.supabase.co";

    const SUPABASE_PUBLISHABLE_KEY =
        "sb_publishable_MzuAQsYmK0JIBEvHMuFvVg_7xh1a3KZ";


    const supabaseClient =
        supabase.createClient(
            SUPABASE_URL,
            SUPABASE_PUBLISHABLE_KEY
        );


    /* =========================
       CHECK LOGIN
       ========================= */

    async function checkLogin() {

        const {
            data: { session }
        } = await supabaseClient.auth.getSession();


        if (!session) {

            window.location.href = "admin.html";

            return false;
        }

        return true;
    }


    /* =========================
       LOAD EVENTS
       ========================= */

    async function loadEvents() {

        const container =
            document.getElementById("eventsContainer");


        const {
            data,
            error
        } = await supabaseClient
            .from("events")
            .select("*")
            .order("event_date", {
                ascending: true
            });


        if (error) {

            container.innerHTML =
                "Could not load events: " +
                error.message;

            return;
        }


        if (!data || data.length === 0) {

            container.innerHTML =
                "<p>No events added yet.</p>";

            return;
        }


        container.innerHTML = "";


        data.forEach(event => {

            const div =
                document.createElement("div");

            div.className = "event";


            div.innerHTML = `

                <h3>${event.title}</h3>

                <p>
                    ${event.description || ""}
                </p>

                <p class="event-info">
                    📅 ${event.event_date}
                </p>

                <p class="event-info">
                    🕐 ${event.event_time || "Time not specified"}
                </p>

                <p class="event-info">
                    📍 ${event.location || "Location not specified"}
                </p>

                <button
                    class="delete-btn"
                    onclick="deleteEvent(${event.id})"
                >
                    Delete
                </button>

            `;


            container.appendChild(div);

        });

    }


    /* =========================
       ADD EVENT
       ========================= */

    document
        .getElementById("eventForm")
        .addEventListener(
            "submit",
            async function(event) {

                event.preventDefault();


                const message =
                    document.getElementById("message");


                message.textContent =
                    "Adding event...";


                const title =
                    document.getElementById("title").value;

                const description =
                    document.getElementById("description").value;

                const event_date =
                    document.getElementById("event_date").value;

                const event_time =
                    document.getElementById("event_time").value;

                const location =
                    document.getElementById("location").value;


                const {
                    error
                } = await supabaseClient
                    .from("events")
                    .insert([{

                        title,
                        description,
                        event_date,
                        event_time,
                        location

                    }]);


                if (error) {

                    message.style.color = "red";

                    message.textContent =
                        "Error: " +
                        error.message;

                    return;
                }


                message.style.color = "green";

                message.textContent =
                    "Event added successfully!";


                document
                    .getElementById("eventForm")
                    .reset();


                loadEvents();

            }
        );


    /* =========================
       DELETE EVENT
       ========================= */

    async function deleteEvent(id) {

        const confirmed =
            confirm(
                "Are you sure you want to delete this event?"
            );


        if (!confirmed) {
            return;
        }


        const {
            error
        } = await supabaseClient
            .from("events")
            .delete()
            .eq("id", id);


        if (error) {

            alert(
                "Could not delete event: " +
                error.message
            );

            return;
        }


        loadEvents();

    }


    /* =========================
       LOGOUT
       ========================= */

    document
        .getElementById("logoutBtn")
        .addEventListener(
            "click",
            async function() {

                await supabaseClient.auth.signOut();

                window.location.href =
                    "admin.html";

            }
        );


    /* =========================
       START
       ========================= */

    async function startDashboard() {

        const loggedIn =
            await checkLogin();


        if (loggedIn) {

            loadEvents();

        }

    }


    startDashboard();

</script>

</body>
</html>
